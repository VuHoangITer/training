<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Training Timer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a; --surface: #111; --border: #222; --text: #f0f0f0; --muted: #666;
        --warn: #f59e0b; --ring-size: min(270px, 68vw);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: var(--bg); color: var(--text); font-family: "DM Sans", sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

      .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; }
      .header-title { font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: 3px; }
      .day-badge { font-family: "DM Mono", monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
      .header-right { display: flex; align-items: center; gap: 12px; }
      .btn-calendar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--muted); cursor: pointer; font-size: 16px; transition: all 0.15s; }
      .btn-calendar:hover { border-color: #444; color: var(--text); }
      .btn-calendar.today-active { border-color: var(--text); color: var(--text); }

      .cal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: flex-start; justify-content: center; padding-top: 80px; }
      .cal-overlay.show { display: flex; }
      .cal-modal { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 16px; width: min(360px, calc(100vw - 32px)); overflow: hidden; animation: slideDown 0.2s ease; }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
      .cal-header { padding: 16px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; }
      .cal-title { font-family: "Bebas Neue", sans-serif; font-size: 18px; letter-spacing: 2px; }
      .cal-nav { display: flex; gap: 4px; }
      .cal-nav-btn { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 6px 10px; color: var(--muted); cursor: pointer; font-size: 13px; transition: all 0.15s; }
      .cal-nav-btn:hover { color: var(--text); border-color: #444; }
      .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 12px 16px 4px; gap: 2px; }
      .cal-wd { text-align: center; font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; padding: 4px 0; }
      .cal-wd.sunday { color: #ef4444; opacity: 0.6; }
      .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 16px 16px; gap: 4px; }
      .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-family: "DM Mono", monospace; font-size: 13px; cursor: pointer; transition: all 0.12s; position: relative; border: 1px solid transparent; }
      .cal-day:hover { background: #1a1a1a; border-color: #333; }
      .cal-day.sunday { color: #ef4444; opacity: 0.5; }
      .cal-day.other-month { color: #333; pointer-events: none; }
      .cal-day.has-training::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--text); opacity: 0.4; }
      .cal-day.done-day::after { background: #22c55e; opacity: 1; width: 6px; height: 6px; }
      .cal-day.selected { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
      .cal-day.is-today { border-color: #444; color: var(--text); }
      .cal-day.is-today:not(.selected) { background: #1a1a1a; }
      .cal-footer { padding: 12px 16px; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .cal-footer-info { font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
      .btn-today { background: transparent; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 10px; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; white-space: nowrap; }
      .btn-today:hover { border-color: var(--text); color: var(--text); }

      .viewing-banner { display: none; background: #161616; border-bottom: 1px solid #1e1e1e; padding: 8px 20px; align-items: center; justify-content: space-between; }
      .viewing-banner.show { display: flex; }
      .viewing-info { font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
      .viewing-info span { color: var(--text); }
      .btn-back-today { background: transparent; border: 1px solid #333; border-radius: 6px; padding: 5px 10px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 10px; cursor: pointer; letter-spacing: 1px; }
      .btn-back-today:hover { color: var(--text); border-color: #555; }

      .progress-bar { height: 2px; background: var(--border); }
      .progress-fill { height: 100%; background: var(--text); transition: width 0.3s; }
      .session-title-bar { padding: 14px; text-align: center; font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
      .info-bar { padding: 10px 20px; border-bottom: 1px solid var(--border); font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; line-height: 1.8; text-align: center; }
      .info-bar b { color: var(--text); font-weight: 500; }
      .info-bar .ok { color: #22c55e; }
      .info-bar .tip { display: block; letter-spacing: 0.5px; text-transform: none; font-family: "DM Sans", sans-serif; font-size: 12px; margin-top: 2px; }


      .home-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
      #homeView { padding-bottom: 40px; }
      #homeToday { margin: 8px 20px 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
      .ht-title { font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: 2px; }
      .ht-sub { font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; line-height: 1.7; }
      .ht-tip { font-size: 12px; color: var(--muted); line-height: 1.5; }
      .home-days .cal-day { aspect-ratio: auto; min-height: 66px; flex-direction: column; gap: 2px; padding: 4px 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
      .home-days .cal-day::after { display: none !important; }
      .home-days .cal-day .dn { font-size: 12px; }
      .home-days .cal-day .em { font-size: 20px; line-height: 1; }
      .home-days .cal-day .tt { font-size: 7.5px; letter-spacing: 0.3px; color: var(--muted); text-align: center; line-height: 1.1; }
      .home-days .cal-day .ck { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #22c55e; }
      .home-days .cal-day:active { background: #222; transform: scale(0.96); }
      .home-days .cal-day.sunday { opacity: 0.55; }
      .home-days .cal-day.is-today { border-color: var(--text); }
      .home-days .cal-day.done-day { background: #0f1a0f; border-color: #1f3a1f; }
      .home-hint { text-align: center; font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; padding: 4px 20px 12px; line-height: 1.7; }
      .home-actions { display: flex; justify-content: center; padding: 0 20px; }
      .countdown-overlay .btn-sec { margin-top: 12px; }

      .content { flex: 1; padding: 0 0 110px; }
      .schedule { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
      .phase-label { font-family: "DM Mono", monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 16px 0 8px; display: flex; align-items: center; gap: 10px; }
      .phase-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
      .round-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
      .round-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
      .round-item.current { border-color: #333; background: #161616; }
      .round-item.done { opacity: 0.35; }
      .round-num { font-family: "Bebas Neue", sans-serif; font-size: 28px; line-height: 1; color: var(--muted); min-width: 36px; text-align: center; }
      .round-item.current .round-num { color: var(--text); }
      .round-info { flex: 1; min-width: 0; }
      .round-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
      .round-detail { font-family: "DM Mono", monospace; font-size: 11px; color: var(--muted); line-height: 1.5; }
      .round-dur { font-family: "Bebas Neue", sans-serif; font-size: 17px; color: var(--muted); letter-spacing: 1px; text-align: right; white-space: nowrap; }
      .round-item.current .round-dur { color: var(--text); }
      .rep-badge { background: #1a2a1a; color: #84cc16; border: 1px solid #2a4a2a; border-radius: 6px; padding: 4px 10px; font-family: "DM Mono", monospace; font-size: 11px; white-space: nowrap; }

      .timer-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
      .timer-overlay.show { display: flex; }
      .t-phase { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
      .t-name { font-family: "Bebas Neue", sans-serif; font-size: clamp(22px, 5.5vw, 36px); letter-spacing: 2px; text-align: center; line-height: 1.15; max-width: 340px; }
      .t-detail { font-family: "DM Mono", monospace; font-size: 11px; color: var(--muted); text-align: center; max-width: 320px; line-height: 1.6; max-height: 7.5em; overflow-y: auto; }
      .ring-container { position: relative; width: var(--ring-size); height: var(--ring-size); }
      .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
      .ring-progress { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear, stroke 0.3s; }
      .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
      .t-sec { font-family: "Bebas Neue", sans-serif; font-size: clamp(65px, 17vw, 100px); line-height: 1; letter-spacing: -2px; }
      .t-lbl { font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .ring-container.warn .t-sec { animation: pulse 0.5s ease-in-out infinite; }
      .rep-display { display: none; flex-direction: column; align-items: center; gap: 14px; }
      .rep-display.show { display: flex; }
      .rep-num { font-family: "Bebas Neue", sans-serif; font-size: clamp(58px, 15vw, 88px); line-height: 1; color: #84cc16; }
      .rep-lbl { font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
      .btn-done { background: #84cc16; color: #000; padding: 16px 48px; border-radius: 12px; font-family: "Bebas Neue", sans-serif; font-size: 20px; letter-spacing: 3px; border: none; cursor: pointer; }
      .btn-done:active { transform: scale(0.96); }
      .next-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; width: calc(100% - 40px); max-width: 340px; }
      .next-lbl { font-family: "DM Mono", monospace; font-size: 10px; letter-spacing: 3px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; }
      .next-name { font-size: 13px; font-weight: 600; }
      .next-detail { font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.4; max-height: 4.2em; overflow: hidden; }
      .t-controls { display: flex; gap: 10px; }
      .btn { border: none; border-radius: 10px; font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.15s; }
      .btn-prim { background: var(--text); color: var(--bg); padding: 15px 32px; font-size: 13px; }
      .btn-sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 15px 20px; }
      .btn-close { position: absolute; top: 18px; right: 18px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); padding: 9px 14px; font-size: 11px; letter-spacing: 1px; }

      .sticky-start { position: fixed; bottom: 0; left: 0; right: 0; padding: 28px 20px 16px; background: linear-gradient(transparent, var(--bg) 30%); z-index: 50; }
      .est-time { text-align: center; font-family: "DM Mono", monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 8px; }
      .est-time span { color: var(--text); }
      .btn-start { width: 100%; background: var(--text); color: var(--bg); padding: 17px; border-radius: 12px; font-family: "Bebas Neue", sans-serif; font-size: 19px; letter-spacing: 4px; cursor: pointer; border: none; }

      .done-screen { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px 20px; text-align: center; min-height: 60vh; }
      .done-screen.show { display: flex; }
      .done-icon { font-size: 60px; animation: bounce 0.6s ease; }
      @keyframes bounce { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
      .done-title { font-family: "Bebas Neue", sans-serif; font-size: 46px; letter-spacing: 4px; }
      .done-sub { color: var(--muted); font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 2px; line-height: 1.7; }
      .no-content { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 20px; text-align: center; color: var(--muted); }
      .no-content-icon { font-size: 48px; opacity: 0.3; }
      .no-content-title { font-family: "Bebas Neue", sans-serif; font-size: 26px; letter-spacing: 2px; color: #444; }
      .no-content-sub { font-family: "DM Mono", monospace; font-size: 11px; }

      .countdown-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 250; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; }
      .countdown-overlay.show { display: flex; }
      .countdown-num { font-family: "Bebas Neue", sans-serif; font-size: clamp(120px, 30vw, 200px); line-height: 1; letter-spacing: -4px; animation: pulse 0.5s ease-in-out infinite; }
      .countdown-lbl { font-family: "DM Mono", monospace; font-size: 13px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; max-width: 340px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <div class="header-title">TRAINING</div>
        <div class="day-badge" id="dayBadge">loading...</div>
      </div>
      <div class="header-right">
        <div class="day-badge" id="dateBadge"></div>
        <button class="btn-calendar" id="btnCalendar" onclick="showHome()" style="display: none">← LỊCH</button>
      </div>
    </div>

    <div id="homeView">
      <div id="homeToday"></div>
      <div class="home-head">
        <button class="cal-nav-btn" onclick="calPrev()">◀</button>
        <div class="cal-title" id="calMonthTitle"></div>
        <button class="cal-nav-btn" onclick="calNext()">▶</button>
      </div>
      <div class="cal-weekdays">
        <div class="cal-wd sunday">CN</div>
        <div class="cal-wd">T2</div><div class="cal-wd">T3</div>
        <div class="cal-wd">T4</div><div class="cal-wd">T5</div>
        <div class="cal-wd">T6</div><div class="cal-wd">T7</div>
      </div>
      <div class="cal-days home-days" id="calDays"></div>
      <div class="home-hint">CHẠM VÀO NGÀY → CHẠY LUÔN<br />GIỮ NGÓN TAY → XEM DANH SÁCH BÀI</div>
      <div class="home-actions"><button class="btn-today" onclick="goToday()">VỀ THÁNG NÀY</button></div>
    </div>

    <div id="dayView" style="display: none">
    <div class="viewing-banner" id="viewingBanner">
      <div class="viewing-info">XEM TRƯỚC: <span id="viewingDate"></span></div>
      <button class="btn-back-today" onclick="goToday()">← HÔM NAY</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    <div class="session-title-bar" id="sessionTitleBar"></div>
    <div class="info-bar" id="infoBar"></div>

    <div class="content">
      <div class="schedule" id="schedule-main"></div>
      <div class="done-screen" id="done-main">
        <div class="done-icon">🔥</div>
        <div class="done-title">XONG BUỔI TẬP!</div>
        <div class="done-sub" id="doneSub">Uống nước, ăn đủ đạm, ngủ sớm — cơ thể phát triển lúc nghỉ ✅</div>
        <button class="btn btn-prim" onclick="showHome()">← VỀ LỊCH</button>
      </div>
    </div>

    <div class="sticky-start" id="stickyStart">
      <div class="est-time" id="estTime"></div>
      <button class="btn-start" onclick="startSession()">BẮT ĐẦU</button>
    </div>

    </div>

    <div class="countdown-overlay" id="countdownOverlay">
      <div class="countdown-lbl">CHUẨN BỊ</div>
      <div class="countdown-num" id="countdownNum">5</div>
      <div class="countdown-lbl" id="countdownNext">—</div>
      <button class="btn btn-sec" onclick="cancelCountdown()">✕ HUỶ</button>
    </div>

    <div class="timer-overlay" id="timerOverlay">
      <button class="btn btn-close" onclick="closeTimer()">✕ ĐÓNG</button>
      <div class="t-phase" id="tPhase"></div>
      <div class="t-name" id="tName">...</div>
      <div class="t-detail" id="tDetail"></div>

      <div id="timerMode">
        <div class="ring-container" id="ringContainer">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="44" />
            <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0" stroke="#f0f0f0" />
          </svg>
          <div class="ring-center">
            <div class="t-sec" id="tSec">30</div>
            <div class="t-lbl" id="tLbl">ON</div>
          </div>
        </div>
      </div>

      <div class="rep-display" id="repMode">
        <div class="rep-num" id="repNum">12</div>
        <div class="rep-lbl">rep — làm chậm, kiểm soát</div>
        <button class="btn-done" onclick="repDone()">✓ HOÀN THÀNH</button>
      </div>

      <div class="next-box">
        <div class="next-lbl">TIẾP THEO</div>
        <div class="next-name" id="nextName">—</div>
        <div class="next-detail" id="nextDetail"></div>
      </div>

      <div class="t-controls" id="tControls">
        <button class="btn btn-sec" id="btnMute" onclick="toggleMute()">🔊</button>
        <button class="btn btn-sec" onclick="skipRound()">SKIP ⏭</button>
        <button class="btn btn-prim" id="btnPR" onclick="togglePause()">PAUSE</button>
      </div>
    </div>

    <script>
      /* ════════════════════════════════════════════════════════════
         GIÁO ÁN KHỞI ĐỘNG LẠI — 12 TUẦN
         Mục tiêu: giảm mỡ từ từ + tăng cơ + học kỹ thuật boxing/tự vệ
         Lịch tuần:
           T2  Sức mạnh A (đẩy + chân)
           T3  Boxing kỹ thuật + cardio
           T4  Cardio nhẹ tại nhà + giãn cơ
           T5  Sức mạnh B (kéo + mông/chân)
           T6  Cardio nhẹ tại nhà + giãn cơ
           T7  Boxing tự vệ + ôn kỹ thuật
           CN  Nghỉ hoàn toàn
         Tuần thứ 4 của mỗi giai đoạn là TUẦN NHẸ (deload) để cơ thể hồi phục.
         Muốn đổi ngày bắt đầu: sửa START_DATE (nên là thứ Hai).
         ════════════════════════════════════════════════════════════ */
      const START_DATE = "2026-10-19";

      const PH_COLOR = {
        warmup: "#777", drill: "#38bdf8", shadow: "#6366f1", defend: "#f97316",
        selfdef: "#f43f5e", build: "#eab308", strength: "#22c55e", core: "#84cc16",
        aerobic: "#14b8a6", easy: "#60a5fa", transition: "#a855f7",
      };
      const PH_LABEL = {
        warmup: "KHỞI ĐỘNG", drill: "KỸ THUẬT", shadow: "SHADOW", defend: "PHÒNG THỦ",
        selfdef: "TỰ VỆ", build: "CARDIO ĐỐT MỠ", strength: "SỨC MẠNH", core: "CORE",
        aerobic: "GIÃN CƠ / HỒI PHỤC", easy: "CARDIO NHẸ", transition: "CHUYỂN GIAO",
      };
      (function () {
        let css = "";
        for (const k in PH_COLOR) css += `.phase-label.${k}{color:${PH_COLOR[k]}}.round-item.${k}::before{background:${PH_COLOR[k]}}`;
        const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);
      })();

      const DAYS_VI = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
      const DAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

      const DAY_TIPS = {

      };
      const TRAIN_DOW = [1, 2, 4, 6]; // các ngày tính vào "buổi chính" mỗi tuần

      /* ── Ngày & tuần ── */
      const realNow = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }));
      const TODAY_Y = realNow.getFullYear(), TODAY_M = realNow.getMonth(), TODAY_D = realNow.getDate();
      let viewDate = new Date(TODAY_Y, TODAY_M, TODAY_D);
      let calYear = TODAY_Y, calMonth = TODAY_M;

      function isToday(d) { return d.getFullYear() === TODAY_Y && d.getMonth() === TODAY_M && d.getDate() === TODAY_D; }
      function isViewDate(d) { return d.getFullYear() === viewDate.getFullYear() && d.getMonth() === viewDate.getMonth() && d.getDate() === viewDate.getDate(); }
      function isPreviewMode() { return !isToday(viewDate); }
      function dkey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
      const $ = (id) => document.getElementById(id);

      /* ── Lịch sử (localStorage) ── */
      const LOG_KEY = "training_log_v2";
      function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "{}"); } catch (e) { return {}; } }
      function saveLog(l) { try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); } catch (e) {} }
      function weekDoneCount() {
        const log = loadLog();
        const off = (viewDate.getDay() + 6) % 7;
        let n = 0;
        for (let i = 0; i < 7; i++) {
          const d = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() - off + i);
          if (TRAIN_DOW.includes(d.getDay()) && log[dkey(d)]) n++;
        }
        return n;
      }

      /* ── Tiến trình theo tuần ── */
      function getPlan() {
        const s = new Date(START_DATE + "T00:00:00");
        const t = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate());
        const diff = Math.round((t - s) / 864e5);
        const pre = diff < 0;
        const w = pre ? 1 : Math.floor(diff / 7) + 1;
        const phase = w <= 4 ? 1 : w <= 8 ? 2 : 3;
        const wip = ((w - 1) % 4) + 1;
        const deload = wip === 4;
        const i = phase - 1;
        const mainTbl = { 1: [2, 2, 3, 2], 2: [3, 3, 3, 2], 3: [3, 3, 4, 2] };
        return {
          w, pre, phase, wip, deload,
          phaseName: ["KHỞI ĐỘNG LẠI", "XÂY NỀN", "TĂNG CƯỜNG"][i],
          mainSets: mainTbl[phase][wip - 1],
          auxSets: deload ? 1 : 2,
          rest: phase === 3 ? 75 : 60,
          tempo: ["hạ 2s", "hạ 3s", "hạ 4s, lên nhanh"][i],
          hold: [20, 30, 40][i],
          plank: [30, 40, 45][i],
          rope: Math.max(1, [2, 3, 3][i] - (deload ? 1 : 0)),
          cRounds: Math.max(3, [5, 6, 8][i] - (deload ? 2 : 0)),
          cOn: [30, 40, 40][i],
          cOff: [30, 20, 20][i],
          drillOn: deload ? 120 : [120, 150, 180][i],
          shadowRounds: deload ? 1 : [2, 2, 3][i],
        };
      }

      /* ── Chủ đề kỹ thuật boxing (vòng lặp 8 tuần) ── */
      const THEMES = [
        { title: "Tư thế & Jab",

            ["Jab thẳng chậm", "Tay trước đấm thẳng, úp nắm đấm khi chạm đích, thu về đúng đường cũ. Tay sau luôn che cằm. Tập trước gương nếu có."],
            ["Jab + bước chân", "Bước chân trước đi trước rồi jab, lùi sau khi đánh. Jab → lùi, jab → xoay trái/phải. Đừng đứng yên sau khi ra đòn."],

            ["Combo 1-2 chậm", "Jab → Cross liền mạch, cross xoay trọn hông, hồi guard sau mỗi lần. Đếm nhịp 'một-hai'."],
            ["1-2 rồi lùi/xoay", "Sau 1-2 lùi một bước hoặc xoay ra ngoài; đừng đứng yên trong tầm đánh."],
          ],
          shadow: "1-2, 1-1-2, jab giả rồi cross. Tăng dần tốc độ lên 60-70% lực." },
        { title: "Hook trái & 1-2-3",
          drills: [
            ["Hook trái đơn", "Tay trước gập ~90°, xoay hông và gót chân trước, khuỷu ngang vai, quay về guard. Quay bằng hông, không vung bằng vai hay tay."],
            ["1-2-3 (Jab-Cross-Hook)", "Hook xuất phát từ lực xoay của cross; tay sau che cằm. Tập chậm cho mượt."],

            ["Slip (né đầu)", "Xoay vai-hông nhẹ để đầu lệch khỏi trục đòn thẳng, mắt luôn nhìn đối thủ, không cúi lưng."],

            ["Phản xạ theo số", "Tự gán số: 1=jab, 2=cross, 3=hook, 4=né trái, 5=block, 6=lùi. Gọi ngẫu nhiên khi đang di chuyển."],

      /* ── Bài tự vệ (xoay vòng) ── */
      const SD = [
        ["Tư thế rào chắn (fence)", "Hai tay mở trước ngực, lòng bàn tay hướng ra, đứng chéo chân, hô 'Dừng lại!'. Giữ khoảng cách, lùi từng bước, sẵn sàng đánh hoặc chạy."],

      ];

      /* ── Helpers tạo bài ── */
      const SAME = "Giữ đúng form và nhịp như set trước";
      function mx(label) { return Math.max(...String(label).match(/\d+/g).map(Number)); }
      function R(ph, name, detail, label, rest) { return { phase: ph, name, detail, reps: mx(label), repTxt: label, restSec: rest }; }
      function repSets(ph, name, detail, label, sets, rest) {
        const a = [];
        for (let s = 1; s <= sets; s++) a.push(R(ph, `${name} SET ${s}`, s === 1 ? detail : SAME, label, rest));
        return a;
      }
      function repPairs(ph, nL, nR, detail, label, sets, rest) {
        const a = [];
        for (let s = 1; s <= sets; s++) {
          a.push(R(ph, `${nL} SET ${s}`, s === 1 ? detail : SAME, label, 0));
          a.push(R(ph, `${nR} SET ${s}`, SAME, label, rest));
        }
        return a;
      }
      function timerSets(ph, name, detail, on, off, sets) {
        const a = [];
        for (let s = 1; s <= sets; s++) a.push({ phase: ph, name: `${name} SET ${s}`, detail: s === 1 ? detail : SAME, onSec: on, offSec: s < sets ? off : 10 });
        return a;
      }
      const pick = (p, arr) => arr[p.phase - 1];

      /* ── Khởi động ── */
      function warmupBoxing() {
        const p = getPlan();
        const a = [{ phase: "warmup", name: "Xoay khớp toàn thân", detail: "Cổ, vai, khuỷu, cổ tay, hông, gối, cổ chân — chậm, rộng, thả lỏng", onSec: 120, offSec: 10 }];
        for (let i = 1; i <= p.rope; i++)
          a.push({ phase: "warmup", name: `Nhảy dây nhẹ R${i}`, detail: "Nhảy đều, thở đều — 30-40% lực. Mệt thì dừng nghỉ rồi nối lại, không cố", onSec: 90, offSec: 30 });
        return a;
      }
      function warmupStrength() {
        return [
          { phase: "warmup", name: "Xoay khớp vai - hông", detail: "Vòng tay lớn, xoay hông, gập-duỗi gối nhẹ", onSec: 60, offSec: 5 },
          { phase: "warmup", name: "Nhảy dây nhẹ", detail: "Nhảy đều 30-40% lực để máu lưu thông", onSec: 120, offSec: 10 },
          { phase: "warmup", name: "Squat không tạ + Push-up chậm", detail: "Làm nhẹ 5-8 rep mỗi bài để cơ quen chuyển động", onSec: 60, offSec: 10 },
        ];
      }

      /* ── Cardio đốt mỡ ── */
      function buildCardio(reduce) {
        const p = getPlan();
        const n = Math.max(2, p.cRounds - (reduce || 0));
        const C = [
          ["Nhảy dây", "Nhảy đều, tăng tốc nhẹ — 70% lực"],
          ["Footwork + Jab-Cross", "Di chuyển liên tục, ra 1-2 mỗi 2-3 bước — 70% lực"],
          ["Shadow tốc độ", "Combo 1-2-3-2 liên tục, thở ra mỗi đòn — 75% lực"],
          ["Burpee không nhảy", "Xuống - bước chân ra sau - đứng lên, nhẹ nhàng — 70% lực"],
        ];
        const a = [];
        for (let i = 0; i < n; i++) {
          const c = C[i % C.length];
          a.push({ phase: "build", name: `Cardio ${i + 1}/${n} — ${c[0]}`, detail: `${c[1]} [${p.cOn}s ON / ${p.cOff}s nghỉ]`, onSec: p.cOn, offSec: i < n - 1 ? p.cOff : 0 });
        }
        return a;
      }

      function coreFinisher() {
        const p = getPlan(), n = p.deload ? 1 : 2;
        return [
          ...timerSets("core", "Hollow Body Hold", "Lưng dán sàn, vai + chân nhấc nhẹ, siết bụng, thở đều", p.hold, 20, n),
          ...repSets("core", "Leg Raise", "Lưng dán sàn, hạ chân chậm, không thả rơi", "10-15", n, 30),
          ...repSets("core", "Bicycle Crunch", "Khuỷu chạm gối đối diện, xoay từ thân, không giật cổ", "16-20", n, 30),
        ];
      }

      /* ── Boxing kỹ thuật (T3) ── */
      function buildBoxingTech() {
        const p = getPlan(), th = THEMES[(p.w - 1) % THEMES.length];
        const items = [...warmupBoxing()];
        th.drills.forEach((d, i) =>
          items.push({ phase: "drill", name: `Drill ${i + 1} — ${d[0]}`, detail: d[1], onSec: p.drillOn, offSec: 30 })
        );
        for (let i = 1; i <= p.shadowRounds; i++)
          items.push({ phase: "shadow", name: `Shadow R${i} — ${th.title}`, detail: th.shadow, onSec: p.drillOn, offSec: 30 });
        items.push(...buildCardio(0));
        items.push(...coreFinisher());
        return items;
      }

      /* ── Boxing tự vệ (T7) ── */
      function buildBoxingSelfDefense() {
        const p = getPlan(), th = THEMES[(p.w - 1) % THEMES.length];
        const rounds = p.deload ? 1 : 2;
        const items = [...warmupBoxing()];
        for (let i = 1; i <= rounds; i++)
          items.push({ phase: "shadow", name: `Ôn kỹ thuật R${i} — ${th.title}`, detail: th.shadow, onSec: p.drillOn, offSec: 30 });
        [0, 1, 2].map((k) => SD[((p.w - 1) * 3 + k) % SD.length]).forEach((d) => {
          for (let r = 1; r <= rounds; r++)

        });
        items.push(...buildCardio(2));
        items.push(...coreFinisher());
        return items;
      }

      /* ── Sức mạnh A: đẩy + chân (T2) ── */
      function buildStrengthA() {
        const p = getPlan(), ms = p.mainSets, as = p.auxSets, rs = p.rest, t = p.tempo;
        return [
          ...warmupStrength(),
          ...repSets("strength", "Goblet Squat 10kg", `Ôm tạ trước ngực, xuống sâu tới khi đùi song song sàn, gót đạp đất, lưng thẳng | ${t}`, pick(p, ["10-12", "12-15", "10-12"]), ms, rs),
          ...repSets("strength", "Push-up", `Thân thẳng như tấm ván, ngực gần chạm sàn | ${t} | Nặng quá → chống tay lên ghế/bàn`, pick(p, ["6-10", "8-12", "10-15"]), ms, rs),
          ...repSets("strength", "Romanian Deadlift 10kg", `Hai tay cầm tạ sát đùi, đẩy mông ra sau, lưng thẳng, cảm nhận căng gân kheo | ${t}`, pick(p, ["10-12", "12-15", "10-12"]), ms, rs),
          ...repSets("strength", "Pike Push-up (vai)", `Hông cao thành chữ V, hạ đỉnh đầu xuống sàn | ${t}`, pick(p, ["5-8", "6-10", "8-12"]), as, rs),
          ...repSets("strength", "Tricep Extension 8kg", `Hai tay giữ tạ sau đầu, khuỷu hướng lên trần, duỗi thẳng tay | ${t}`, pick(p, ["10-12", "12-15", "10-12"]), as, 45),
          ...timerSets("core", "Plank", "Siết bụng + mông, thân thẳng, thở đều", p.plank, 30, as),
        ];
      }

      /* ── Sức mạnh B: kéo + mông/chân (T5) ── */
      function buildStrengthB() {
        const p = getPlan(), ms = p.mainSets, as = p.auxSets, rs = p.rest, t = p.tempo;
        const items = [
          ...warmupStrength(),
          ...repPairs("strength", "Row TRÁI 10kg", "Row PHẢI 10kg", `Chống tay-gối lên ghế, kéo khuỷu về hông, bóp bả vai 1s, hạ chậm | ${t}`, pick(p, ["10-12", "12-15", "10-12"]), ms, rs),
          ...repSets("strength", "Chin-up", `Không có xà → bấm SKIP. Kéo cằm qua xà, hạ chậm 3s, dừng trước khi hết sức | ${t}`, pick(p, ["2-4", "3-6", "4-8"]), ms, rs),
          ...repPairs("strength", "Split Squat TRÁI", "Split Squat PHẢI", `Ôm tạ 10kg, chân sau chống mũi, xuống sâu, chân trước gánh chính | ${t}`, pick(p, ["8-10", "10-12", "10-12"]), ms, rs),
          ...repSets("strength", "Glute Bridge 10kg", "Đặt tạ lên hông, đẩy hông lên, bóp mông 2s ở đỉnh", pick(p, ["12-15", "15-20", "12-15"]), as, 45),
          ...repPairs("strength", "Curl TRÁI 8kg", "Curl PHẢI 8kg", `Khuỷu cố định sát thân, không đung đưa | ${t}`, pick(p, ["10-12", "12-15", "10-12"]), as, 45),
          ...repSets("strength", "Rear Delt Fly 5kg", "Cúi người, mở tay sang hai bên, bóp vai sau — giữ vai không cuộn", pick(p, ["12-15", "15", "15"]), as, 45),
        ];
        for (let s = 1; s <= as; s++) {
          items.push({ phase: "core", name: `Side Plank TRÁI SET ${s}`, detail: s === 1 ? "Thân thẳng, hông không võng — core bên giúp chống bị quật khi áp sát" : SAME, onSec: Math.round(p.plank * 0.7), offSec: 10 });
          items.push({ phase: "core", name: `Side Plank PHẢI SET ${s}`, detail: SAME, onSec: Math.round(p.plank * 0.7), offSec: s < as ? 30 : 10 });
        }
        items.push(...repSets("core", "Dead Bug", "Lưng dán sàn, duỗi tay-chân đối diện chậm, thở đều", "8-10", as, 30));
        return items;
      }

      /* ── Nghỉ chủ động: giãn cơ (T4, T6) ── */
      function buildRecovery() {
        return [
          { phase: "aerobic", name: "Giãn cổ & vai", detail: "Nghiêng đầu sang từng bên, kéo nhẹ — 20s mỗi bên", onSec: 40, offSec: 5 },
          { phase: "aerobic", name: "Giãn ngực", detail: "Hai tay ra sau lưng hoặc đặt tay lên khung cửa, mở ngực", onSec: 30, offSec: 5 },
          { phase: "aerobic", name: "Giãn vai sau", detail: "Kéo tay qua ngực, 20s mỗi bên", onSec: 40, offSec: 5 },
          { phase: "aerobic", name: "Giãn lưng — tư thế em bé", detail: "Quỳ, mông ngồi lên gót, trải tay ra trước, thở sâu", onSec: 40, offSec: 5 },
          { phase: "aerobic", name: "Giãn hông (bồ câu)", detail: "Mỗi bên 30s, giữ lưng thẳng, thở chậm", onSec: 60, offSec: 5 },
          { phase: "aerobic", name: "Giãn đùi trước", detail: "Kéo gót về phía mông, 20s mỗi chân", onSec: 40, offSec: 5 },
          { phase: "aerobic", name: "Giãn gân kheo", detail: "Ngồi duỗi thẳng chân, cúi người, 30s", onSec: 30, offSec: 5 },
          { phase: "aerobic", name: "Giãn lưng dưới", detail: "Nằm co gối ôm ngực, lắc nhẹ", onSec: 30, offSec: 5 },
          { phase: "aerobic", name: "Hít thở sâu", detail: "Hít 4s — thở ra 6s, thả lỏng hoàn toàn", onSec: 45, offSec: 0 },
        ];
      }

      /* ── Nghỉ chủ động (T4, T6): cardio nhẹ tại nhà + giãn cơ ── */
      function buildRestDay() {
        const p = getPlan();
        const n = Math.max(2, [3, 4, 4][p.phase - 1] - (p.deload ? 1 : 0));
        const C = [
          ["Nhảy dây chậm", "Nhảy đều, nhịp thấp, thở bằng mũi — ~60% sức, nói chuyện được"],
          ["Footwork nhẹ", "Tiến-lùi-trái-phải trong tư thế boxing, tay guard thả lỏng — ~60% sức"],
          ["Shadow nhẹ", "Jab-Cross-Hook chậm, tập trung form và thở đều — ~50-60% sức"],
        ];
        const items = [{ phase: "warmup", name: "Xoay khớp nhẹ", detail: "Cổ, vai, hông, gối — thả lỏng", onSec: 90, offSec: 10 }];
        for (let i = 0; i < n; i++) {
          const c = C[i % C.length];
          items.push({ phase: "easy", name: `Cardio nhẹ ${i + 1}/${n} — ${c[0]}`, detail: c[1], onSec: 180, offSec: i < n - 1 ? 30 : 0 });
        }
        return [...items, ...buildRecovery()];
      }

      function buildDay(dayEn) {
        const map = {
          Monday: buildStrengthA, Tuesday: buildBoxingTech, Wednesday: buildRestDay,
          Thursday: buildStrengthB, Friday: buildRestDay, Saturday: buildBoxingSelfDefense,
        };
        return map[dayEn] ? map[dayEn]() : [];
      }

      /* ── Màn hình chính: lịch tháng (chạm ngày → chạy luôn) ── */
      const DAY_ICON = { 1: ["💪", "SỨC MẠNH A"], 2: ["🥊", "BOXING"], 3: ["🧘", "CARDIO NHẸ"], 4: ["💪", "SỨC MẠNH B"], 5: ["🧘", "CARDIO NHẸ"], 6: ["🛡️", "TỰ VỆ"], 0: ["😴", "NGHỈ"] };
      let cdIv = null, pressT = null, longFired = false;

      function showHome() {
        if (ts.iv) { clearInterval(ts.iv); ts.iv = null; }
        cancelCountdown();
        if (synth) synth.cancel();
        unlockScreen();
        $("timerOverlay").classList.remove("show");
        $("homeView").style.display = "";
        $("dayView").style.display = "none";
        $("btnCalendar").style.display = "none";
        $("dayBadge").textContent = "LỊCH TẬP";
        $("dateBadge").textContent = "";
        calYear = viewDate.getFullYear(); calMonth = viewDate.getMonth();
        renderCalendar();
      }
      function showDay() {
        $("homeView").style.display = "none";
        $("dayView").style.display = "";
        $("btnCalendar").style.display = "";
      }
      function openCalendar() { showHome(); }
      function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
      function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

      function renderCalendar() {
        $("calMonthTitle").textContent = `${MONTHS_VI[calMonth].toUpperCase()} ${calYear}`;
        const log = loadLog();
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const daysInPrev = new Date(calYear, calMonth, 0).getDate();
        let html = "";
        for (let i = firstDay - 1; i >= 0; i--) html += `<div class="cal-day other-month"><span class="dn">${daysInPrev - i}</span></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(calYear, calMonth, d), dow = date.getDay();
          let cls = "cal-day";
          if (dow === 0) cls += " sunday";
          if (isToday(date)) cls += " is-today";
          const done = !!log[dkey(date)];
          if (done) cls += " done-day";
          const ic = DAY_ICON[dow];
          html += `<div class="${cls}" data-y="${calYear}" data-m="${calMonth}" data-d="${d}">${done ? '<span class="ck">✓</span>' : ""}<span class="dn">${d}</span><span class="em">${ic[0]}</span><span class="tt">${ic[1]}</span></div>`;
        }
        const total = firstDay + daysInMonth, remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let d = 1; d <= remaining; d++) html += `<div class="cal-day other-month"><span class="dn">${d}</span></div>`;
        $("calDays").innerHTML = html;
        bindHome();

        // thẻ "hôm nay"
        const keep = viewDate;
        viewDate = new Date(TODAY_Y, TODAY_M, TODAY_D);
        const p = getPlan(), dEn = DAYS_EN[viewDate.getDay()], doneW = weekDoneCount();
        viewDate = keep;
        let sub = `TUẦN ${p.w} · ${p.phaseName}${p.deload ? " · TUẦN NHẸ" : ""}`;
        if (p.pre) sub += ` · BẮT ĐẦU ${START_DATE.split("-").reverse().join("/")}`;
        sub += ` · TUẦN NÀY ${doneW}/4 BUỔI`;
        $("homeToday").innerHTML =
          `<div class="ht-sub">HÔM NAY · ${DAYS_VI[new Date(TODAY_Y, TODAY_M, TODAY_D).getDay()].toUpperCase()} ${String(TODAY_D).padStart(2, "0")}/${String(TODAY_M + 1).padStart(2, "0")}</div>` +
          `<div class="ht-title">${SESSION_TITLES[dEn]}</div><div class="ht-sub">${sub}</div>` +
          (DAY_TIPS[dEn] ? `<div class="ht-tip">💡 ${DAY_TIPS[dEn]}</div>` : "") +
          (dEn !== "Sunday" ? `<button class="btn-start" onclick="openToday()">▶ BẮT ĐẦU HÔM NAY</button>` : "");
      }

      function bindHome() {
        const el = $("calDays");
        el.onpointerdown = (e) => {
          const c = e.target.closest(".cal-day[data-d]");
          if (!c) return;
          longFired = false; clearTimeout(pressT);
          pressT = setTimeout(() => { longFired = true; openDay(c, false); }, 500);
        };
        el.onpointerup = el.onpointerleave = el.onpointercancel = () => clearTimeout(pressT);
        el.onclick = (e) => {
          const c = e.target.closest(".cal-day[data-d]");
          if (!c) return;
          if (longFired) { longFired = false; return; }
          openDay(c, true);
        };
        el.oncontextmenu = (e) => e.preventDefault();
      }
      function openDay(c, run) {
        viewDate = new Date(+c.dataset.y, +c.dataset.m, +c.dataset.d);
        showDay(); loadViewDate();
        if (run && sessData.main.length) startSession();
      }
      function openToday() {
        viewDate = new Date(TODAY_Y, TODAY_M, TODAY_D);
        showDay(); loadViewDate(); startSession();
      }
      function selectDate(y, m, d) { viewDate = new Date(y, m, d); showDay(); loadViewDate(); }
      function goToday() {
        viewDate = new Date(TODAY_Y, TODAY_M, TODAY_D);
        if ($("dayView").style.display !== "none") { loadViewDate(); }
        else { calYear = TODAY_Y; calMonth = TODAY_M; renderCalendar(); }
      }

      /* ── Hiển thị ngày ── */
      let sessData = { main: [] };

      function loadViewDate() {
        const dayIdx = viewDate.getDay(), dayEn = DAYS_EN[dayIdx], preview = isPreviewMode();
        $("dayBadge").textContent = DAYS_VI[dayIdx].toUpperCase();
        $("dateBadge").textContent = viewDate.toLocaleDateString("vi-VN");
        $("sessionTitleBar").textContent = SESSION_TITLES[dayEn] || "";
        if (preview) {
          $("viewingDate").textContent = `${DAYS_VI[dayIdx]} ${String(viewDate.getDate()).padStart(2, "0")}/${String(viewDate.getMonth() + 1).padStart(2, "0")}/${viewDate.getFullYear()}`;
          $("viewingBanner").classList.add("show");
        } else $("viewingBanner").classList.remove("show");
        $("btnCalendar").classList.toggle("today-active", !preview);
        $("done-main").classList.remove("show");
        $("schedule-main").style.display = "";
        if (ts.iv) { clearInterval(ts.iv); ts.iv = null; }
        $("timerOverlay").classList.remove("show");
        $("progressFill").style.width = "0%";

        const p = getPlan();
        let info = `TUẦN <b>${p.w}</b> · <b>${p.phaseName}</b>`;
        if (p.deload) info += " · <b>TUẦN NHẸ (DELOAD)</b>";
        if (p.pre) info += ` · BẮT ĐẦU ${START_DATE.split("-").reverse().join("/")}`;
        if (dayEn === "Tuesday") info += ` · CHỦ ĐỀ: <b>${THEMES[(p.w - 1) % THEMES.length].title.toUpperCase()}</b>`;
        const done = weekDoneCount();
        info += ` · TUẦN NÀY: <span class="${done >= 4 ? "ok" : ""}"><b>${done}/4</b></span> BUỔI CHÍNH`;
        if (DAY_TIPS[dayEn]) info += `<span class="tip">💡 ${DAY_TIPS[dayEn]}</span>`;
        $("infoBar").innerHTML = info;

        if (dayEn === "Sunday") {
          $("schedule-main").innerHTML = '<div class="no-content"><div class="no-content-icon">😴</div><div class="no-content-title">CHỦ NHẬT</div><div class="no-content-sub">nghỉ hoàn toàn — ngủ đủ, ăn đủ đạm 🛌</div></div>';
          $("stickyStart").style.display = "none";
          sessData = { main: [] };
          return;
        }
        const items = buildDay(dayEn);
        sessData = { main: items };
        renderSchedule(items, "schedule-main");
        $("stickyStart").style.display = "block";
        $("estTime").innerHTML = (() => { const e = calcEstTime(items); return e ? `⏱ ước tính cả buổi: <span>${e}</span>` : ""; })();
      }

      function fmtDur(item) {
        if (item.reps) return item.restSec > 0 ? `${item.repTxt} REP + ${item.restSec}s` : `${item.repTxt} REP`;
        if (item.offSec > 0) return `${item.onSec}s+${item.offSec}s`;
        const s = item.onSec;
        return s >= 60 ? Math.floor(s / 60) + "m" + (s % 60 > 0 ? (s % 60) + "s" : "") : s + "s";
      }
      function calcEstTime(items) {
        if (!items || !items.length) return null;
        let total = 0;
        items.forEach((it) => { total += isRep(it) ? it.reps * 4 + (it.restSec || 0) : (it.onSec || 0) + (it.offSec || 0); });
        if (!total) return null;
        return `~${Math.round(total / 60)} phút`;
      }
      function renderSchedule(items, cid) {
        const el = $(cid);
        if (!items || !items.length) { el.innerHTML = '<div class="no-content"><div class="no-content-icon">📭</div><div class="no-content-title">KHÔNG CÓ LỊCH</div></div>'; return; }
        let html = "", lastPh = "";
        items.forEach((item, i) => {
          if (item.phase !== lastPh) { html += `<div class="phase-label ${item.phase}">${PH_LABEL[item.phase] || item.phase}</div>`; lastPh = item.phase; }
          const dur = item.reps ? `<div class="rep-badge">${fmtDur(item)}</div>` : `<div class="round-dur">${fmtDur(item)}</div>`;
          html += `<div class="round-item ${item.phase}" id="item-${i}" onclick="jumpToRound(${i})">
            <div class="round-num">${i + 1}</div>
            <div class="round-info"><div class="round-name">${item.name}</div><div class="round-detail">${item.detail || ""}</div></div>
            ${dur}</div>`;
        });
        el.innerHTML = html;
      }

      /* ── Timer (dựa trên mốc thời gian thực, không lệch khi tab nền) ── */
      const isRep = (item) => !!item.reps;
      let ts = { items: [], idx: 0, mode: "on", endAt: 0, total: 0, remMs: 0, paused: false, iv: null };
      let muted = false, lastBeep = -1, audioCtx = null, wakeLock = null;
      const synth = window.speechSynthesis;
      const CIRC = 2 * Math.PI * 44;

      function speak(txt) {
        if (muted || !synth) return;
        try { synth.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = "vi-VN"; u.rate = 1.05; synth.speak(u); } catch (e) {}
      }
      function ensureAudio() {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
        } catch (e) {}
      }
      function beep(type) {
        if (muted) return;
        try {
          ensureAudio();
          const tones = { warn: [[880, 0.12]], end: [[660, 0.15], [880, 0.25]], start: [[440, 0.3]] }[type] || [];
          let t = audioCtx.currentTime;
          tones.forEach(([f, d]) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.01, t + d);
            o.start(t); o.stop(t + d); t += d + 0.05;
          });
        } catch (e) {}
      }
      async function lockScreen() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
      function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && $("timerOverlay").classList.contains("show")) lockScreen();
      });

      function toggleMute() { muted = !muted; $("btnMute").textContent = muted ? "🔇" : "🔊"; if (muted && synth) synth.cancel(); }
      function getRem() { return ts.paused ? Math.ceil(ts.remMs / 1000) : Math.max(0, Math.ceil((ts.endAt - Date.now()) / 1000)); }
      function setStage(mode, sec) { ts.mode = mode; ts.total = sec; ts.endAt = Date.now() + sec * 1000; ts.remMs = sec * 1000; lastBeep = -1; }

      function showRing(show) {
        $("timerMode").style.display = show ? "block" : "none";
        $("repMode").classList.toggle("show", !show);
      }
      function updateRing(prog, ph) {
        const r = $("ringProgress");
        r.style.strokeDashoffset = CIRC * (1 - prog);
        r.style.stroke = PH_COLOR[ph] || "#f0f0f0";
      }
      function updateUI() {
        const it = ts.items[ts.idx];
        if (!it) return;
        const nx = ts.items[ts.idx + 1];
        $("tPhase").textContent = PH_LABEL[it.phase] || it.phase;
        let nextN = "", nextD = "";
        if (ts.mode === "rep") {
          showRing(false);
          $("tName").textContent = it.name;
          $("tDetail").textContent = it.detail || "";
          $("repNum").textContent = it.repTxt;
          if (it.restSec > 0) { nextN = `NGHỈ ${it.restSec}s`; nextD = nx ? nx.name : ""; }
          else { nextN = nx ? nx.name : "🏁 KẾT THÚC"; nextD = nx ? nx.detail || "" : ""; }
        } else {
          showRing(true);
          const on = ts.mode === "on", rem = getRem(), warn = on && rem <= 10 && rem > 0;
          $("tName").textContent = on ? it.name : "NGHỈ";
          $("tDetail").textContent = on ? it.detail || "" : "Thở đều, uống nước, chuẩn bị tiếp theo";
          $("tSec").textContent = rem;
          $("tLbl").textContent = on ? "ON" : "NGHỈ";
          $("tSec").style.color = warn ? "var(--warn)" : on ? "var(--text)" : "var(--muted)";
          updateRing(ts.total > 0 ? rem / ts.total : 0, on ? it.phase : "warmup");
          $("ringContainer").classList.toggle("warn", warn);
          if (on && it.offSec > 0) { nextN = `NGHỈ ${it.offSec}s`; nextD = ""; }
          else { nextN = nx ? nx.name : "🏁 KẾT THÚC"; nextD = nx ? nx.detail || "" : ""; }
        }
        $("nextName").textContent = nextN;
        $("nextDetail").textContent = nextD;
        document.querySelectorAll("#schedule-main .round-item").forEach((el, i) => {
          el.classList.toggle("current", i === ts.idx);
          el.classList.toggle("done", i < ts.idx);
        });
        $("progressFill").style.width = (ts.idx / ts.items.length) * 100 + "%";
      }

      function beginItem(idx) {
        ts.idx = idx;
        const it = ts.items[idx];
        if (isRep(it)) { ts.mode = "rep"; lastBeep = -1; speak(`${it.name}. ${it.repTxt} rep`); }
        else { setStage("on", it.onSec); speak(it.detail ? `${it.name}. ${it.detail.split("|")[0]}` : it.name); }
        updateUI();
      }
      function advance() {
        if (ts.idx + 1 >= ts.items.length) { finishSession(); return; }
        beginItem(ts.idx + 1);
      }
      function stageEnd() {
        const it = ts.items[ts.idx];
        if (ts.mode === "on") {
          beep("end");
          if (it.offSec > 0) { setStage("off", it.offSec); speak("Nghỉ"); updateUI(); return; }
          advance();
        } else { beep("start"); advance(); }
      }
      function tick() {
        if (ts.paused || ts.mode === "rep") return;
        const rem = Math.ceil((ts.endAt - Date.now()) / 1000);
        if (rem <= 0) { stageEnd(); return; }
        if (rem <= 3 && rem !== lastBeep) { lastBeep = rem; beep("warn"); }
        updateUI();
      }
      function repDone() {
        beep("end");
        const it = ts.items[ts.idx];
        if (it && it.restSec > 0) { setStage("rest", it.restSec); speak(`Nghỉ ${it.restSec} giây`); updateUI(); }
        else advance();
      }
      function togglePause() {
        if (ts.mode === "rep") return;
        if (!ts.paused) { ts.remMs = Math.max(0, ts.endAt - Date.now()); ts.paused = true; }
        else { ts.endAt = Date.now() + ts.remMs; ts.paused = false; }
        $("btnPR").textContent = ts.paused ? "TIẾP" : "PAUSE";
        updateUI();
      }
      function skipRound() { advance(); }

      function startSession() {
        const items = sessData.main;
        if (!items || !items.length) return;
        ensureAudio();
        startCountdown(items, 0);
      }
      function startCountdown(items, startIdx) {
        let count = 5;
        const first = items[startIdx];
        $("countdownNext").textContent = first.name;
        $("countdownNum").textContent = count;
        $("countdownOverlay").classList.add("show");
        speak("Chuẩn bị");
        ensureAudio();
        if (cdIv) clearInterval(cdIv);
        cdIv = setInterval(() => {
          count--;
          if (count <= 0) {
            clearInterval(cdIv); cdIv = null;
            $("countdownOverlay").classList.remove("show");
            if (ts.iv) clearInterval(ts.iv);
            ts = { items, idx: startIdx, mode: "on", endAt: 0, total: 0, remMs: 0, paused: false, iv: null };
            $("btnPR").textContent = "PAUSE";
            $("timerOverlay").classList.add("show");
            lockScreen();
            beginItem(startIdx);
            ts.iv = setInterval(tick, 250);
          } else { $("countdownNum").textContent = count; beep("warn"); }
        }, 1000);
      }
      function cancelCountdown() {
        if (cdIv) { clearInterval(cdIv); cdIv = null; }
        $("countdownOverlay").classList.remove("show");
        if (synth) synth.cancel();
      }
      function jumpToRound(idx) {
        const items = sessData.main;
        if (!items || idx >= items.length) return;
        if (ts.iv) { clearInterval(ts.iv); ts.iv = null; }
        startCountdown(items, idx);
      }
      function closeTimer() {
        if (ts.iv) { clearInterval(ts.iv); ts.iv = null; }
        if (synth) synth.cancel();
        unlockScreen();
        $("timerOverlay").classList.remove("show");
      }
      function finishSession() {
        if (ts.iv) { clearInterval(ts.iv); ts.iv = null; }
        if (synth) synth.cancel();
        unlockScreen();
        $("timerOverlay").classList.remove("show");
        $("schedule-main").style.display = "none";
        $("done-main").classList.add("show");
        $("stickyStart").style.display = "none";
        $("progressFill").style.width = "100%";
        { const log = loadLog(); log[dkey(viewDate)] = 1; saveLog(log); loadInfoOnly(); }
        beep("end"); setTimeout(() => beep("end"), 600);
        speak("Hoàn thành! Tuyệt vời!");
      }
      function loadInfoOnly() {
        // cập nhật lại số buổi trong tuần mà không dựng lại lịch
        const done = weekDoneCount();
        const el = $("infoBar");
        el.innerHTML = el.innerHTML.replace(/TUẦN NÀY:[\s\S]*?BUỔI CHÍNH/, `TUẦN NÀY: <span class="${done >= 4 ? "ok" : ""}"><b>${done}/4</b></span> BUỔI CHÍNH`);
      }

      showHome();
    </script>
  </body>
</html>
